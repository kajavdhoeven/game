<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14100c">
  <meta name="description" content="Te-Un X3M: een stuntspel op een fatbike, motor of gouden vape. 25 levels, drie voertuigen en vier personages.">
  <title>Te-Un X3M</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div class="ink left"><b id="hudLevel">#1</b></div>
    <div class="ink mid"><i class="clock"></i><b id="hudTime">00.00</b></div>
    <div class="ink right">
      <button id="btnPause" aria-label="Pauze">&#10074;&#10074;</button>
      <button id="btnSound" aria-label="Geluid">&#128266;</button>
    </div>
    <div id="hint" class="hint">Gas: &#8593; of W &nbsp; Rem: &#8595; of S &nbsp; Leunen: &#8592; &#8594; of A D &nbsp; Opnieuw: R</div>
  </div>

  <div id="flip" class="flip"></div>
  <div id="touch" hidden>
    <div class="tl"><button data-k="left" aria-label="Achterover leunen">&#8630;</button><button data-k="right" aria-label="Voorover leunen">&#8631;</button></div>
    <div class="tr"><button data-k="brake" aria-label="Rem">REM</button><button data-k="gas" class="gas" aria-label="Gas">GAS</button></div>
  </div>


  <main id="menu" class="screen">
    <h1 class="logo-h"><img class="title-logo" src="/assets/te-un-x3m-logo.png" alt="Te-Un X3M" width="672" height="622"></h1>
    <p class="sub">Rijd door gevaarlijke levels. Wees snel voor sterren, upgrade je voertuig en speel nieuwe personages vrij.</p>
    <div class="row">
      <button id="mPlay" class="big">Spelen</button>
      <button id="mGarage" class="big alt">Garage</button><button id="mBoard" class="big alt">🏆 Leaderboard</button>
    </div>
    <p id="mStars" class="chip"></p>
  </main>

  <section id="levels" class="screen" hidden>
    <header class="top"><button id="lBack" class="small">&#8592; Menu</button><h2>Kies een level</h2><span id="lStars" class="chip"></span></header>
    <div id="lGrid" class="grid"></div>
  </section>

  <section id="garage" class="screen" hidden>
    <header class="top"><button id="gBack" class="small">&#8592; Menu</button><h2>Garage</h2><span id="gStars" class="chip"></span></header>
    <div class="gwrap">
      <h3>Voertuigen</h3>
      <div id="gVeh" class="cards"></div>
      <h3>Personages</h3>
      <div id="gChar" class="cards"></div>
    </div>
  </section>

  <div id="pause" class="overlay" hidden>
    <div class="card"><h2>Pauze</h2>
      <div class="col"><button id="pResume" class="big">Verder</button><button id="pMenu" class="big alt">Menu</button></div>
    </div>
  </div>

  <div id="end" class="overlay" hidden>
    <div class="card"><h2 id="eTitle">Level klaar!</h2>
      <div id="eStars" class="stars"></div>
      <p id="eText"></p>
      <div id="eUnlock" class="unlock" hidden></div>
      <div class="row"><button id="eBoard" class="big alt">🏆</button><button id="eMenu" class="big alt">Levels</button><button id="eRetry" class="big alt">Opnieuw</button><button id="eNext" class="big">Volgende</button></div>
    </div>
  </div>
  <div id="rotate" class="rotate" hidden>Draai je telefoon voor het beste beeld</div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
